name: AleCal
options:
  bundleIdPrefix: com.softai
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  AleCal:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - AleCal.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: AleCal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 SoftAI Yazılım"
        NSCalendarsUsageDescription: "AleCal shows your calendar events in the menu bar."
        NSCalendarsFullAccessUsageDescription: "AleCal shows, creates and deletes your calendar events from the menu bar."
        CFBundleLocalizations: [en, tr]
    entitlements:
      path: Resources/AleCal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softai.alecal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: false
